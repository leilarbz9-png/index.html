<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Léa Délice | حلويات تُصنع بحب</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7f3;
            color: #4a3030;
        }

        /* الصفحة الافتتاحية */

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;

            background: linear-gradient(
                135deg,
                #fff0e8,
                #fde1dc,
                #fff7f3
            );
        }

        .logo {
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 48px;
            margin: 10px 0;
        }

        .welcome {
            font-size: 21px;
            line-height: 1.9;
            max-width: 650px;
            margin: 10px auto 30px;
            color: #705858;
        }

        .order-button {
            display: inline-block;
            text-decoration: none;
            background: #b86b77;
            color: white;
            padding: 16px 38px;
            border-radius: 35px;
            font-size: 19px;
            transition: 0.3s;
        }

        .order-button:hover {
            transform: scale(1.05);
        }


        /* قسم حلوياتنا */

        .gallery-section {
            padding: 55px 0 70px;
            overflow: hidden;
        }

        .gallery-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: move 25s linear infinite;
        }

        .sweet {
            width: 230px;
            height: 170px;
            border-radius: 20px;
            overflow: hidden;
            background: #f1d8d2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .sweet img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes move {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }


        /* الهاتف */

        @media (max-width: 600px) {

            .hero {
                min-height: 70vh;
            }

            .logo {
                font-size: 50px;
            }

            h1 {
                font-size: 36px;
            }

            .welcome {
                font-size: 18px;
            }

            .gallery-title {
                font-size: 28px;
            }

            .sweet {
                width: 190px;
                height: 140px;
            }
        }
    </style>
</head>


<body>

    <!-- الصفحة الافتتاحية -->

    <section class="hero">

        <div class="logo">
            🍰
        </div>

        <h1>
            Léa Délice
        </h1>

        <p class="welcome">
            حلويات تُصنع بحب ❤️
            <br>
            نكهات مميزة، تفاصيل جميلة،
            ولحظات تستحق أن تُحتفل بها.
        </p>

        <a href="products.html" class="order-button">
            اطلب الآن 🛍️
        </a>

    </section>


    <!-- معرض الحلويات -->

    <section class="gallery-section">

        <h2 class="gallery-title">
            حلوياتنا 🍰
        </h2>

        <div class="gallery">

            <div class="sweet">🍓 كيك الفراولة</div>

            <div class="sweet">🍫 كيك الشوكولاتة</div>

            <div class="sweet">🧁 كب كيك</div>

            <div class="sweet">🍪 كوكيز</div>

            <div class="sweet">🥐 كرواسون</div>

            <div class="sweet">🍰 تشيز كيك</div>

            <!-- تكرار الصور لجعل الشريط مستمرًا -->

            <div class="sweet">🍓 كيك الفراولة</div>

            <div class="sweet">🍫 كيك الشوكولاتة</div>

            <div class="sweet">🧁 كب كيك</div>

        </div>

    </section>

</body>

</html>
