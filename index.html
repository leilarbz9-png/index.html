<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Léa Délice | حلويات تُصنع بحب</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f5;
            text-align: center;
            color: #333;
        }

        header {
            padding: 80px 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 20px;
            color: #666;
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.8;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }

        section {
            padding: 50px 20px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 35px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            width: 250px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .product h3 {
            font-size: 22px;
        }

        .product p {
            color: #666;
            line-height: 1.6;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 35px;
            }

            header {
                padding: 60px 20px;
            }

            .product {
                width: 85%;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>🍰 Léa Délice</h1>

        <p>
            حلويات تُصنع بحب ❤️
            <br>
            نكهات مميزة، تفاصيل جميلة، ولحظات تستحق أن تُحتفل بها.
        </p>

        <button>
            اطلب الآن
        </button>

    </header>


    <section>

        <h2>حلوياتنا 🍰</h2>

        <div class="products">

            <div class="product">
                <h3>🍓 كيك الفراولة</h3>
                <p>
                    كيك طازج ولذيذ بالفراولة
                </p>
                <div class="price">
                    800 دج
                </div>
            </div>


            <div class="product">
                <h3>🍫 كيك الشوكولاتة</h3>
                <p>
                    شوكولاتة غنية لعشاق الحلويات
                </p>
                <div class="price">
                    900 دج
                </div>
            </div>


            <div class="product">
                <h3>🧁 كب كيك</h3>
                <p>
                    كب كيك صغير ولذيذ
                </p>
                <div class="price">
                    150 دج
                </div>
            </div>

        </div>

    </section>

</body>

</html>
