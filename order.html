<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تأكيد الطلب - Léa Délice</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff7f9;
    color: #4a2c35;
}

nav {
    background: #ff7f9c;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

h1, h2 {
    text-align: center;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.product {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.total {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin-top: 20px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    height: 90px;
    resize: vertical;
}

.delivery {
    margin-top: 15px;
}

.delivery label {
    display: inline-block;
    margin-left: 20px;
    font-weight: normal;
}

.delivery input {
    width: auto;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    border: none;
    border-radius: 12px;
    background: #ff5f85;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.success {
    display: none;
    text-align: center;
    background: #fff;
    padding: 35px 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.success h2 {
    color: #e85d75;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #e85d75;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<nav>
    <a href="index.html">🍰 Léa Délice</a>
    <a href="products.html">العودة للحلويات</a>
</nav>

<div class="container">

    <h1>🛍️ تأكيد طلبك</h1>

    <!-- ملخص الطلب -->
    <div class="box">
        <h2>🍰 طلبك</h2>

        <div id="orderItems"></div>

        <div class="total">
            المجموع: <span id="orderTotal">0</span> دج
        </div>
    </div>

    <!-- معلومات الزبون -->
    <div class="box" id="customerFormBox">

        <h2>👤 معلومات الزبون</h2>

        <form id="orderForm">

            <label>
                الاسم الكامل
                <input type="text" id="name" required>
            </label>

            <label>
                رقم الهاتف
                <input type="tel" id="phone" required>
            </label>

            <label>
                الولاية
                <input type="text" id="wilaya" required>
            </label>

            <label>
                البلدية
                <input type="text" id="commune" required>
            </label>

            <label>
                العنوان
                <input type="text" id="address" required>
            </label>

            <label>طريقة التوصيل</label>

            <div class="delivery">

                <label>
                    <input type="radio"
                           name="delivery"
                           value="المنزل"
                           checked>
                    🏠 إلى المنزل
                </label>

                <label>
                    <input type="radio"
                           name="delivery"
                           value="المكتب">
                    🏢 إلى المكتب
                </label>

            </div>

            <label>
                ملاحظات إضافية
                <textarea id="notes"
                          placeholder="مثلاً: بدون سكر، وقت مناسب للتوصيل..."></textarea>
            </label>

            <button type="submit">
                ✅ إرسال الطلب
            </button>

        </form>

    </div>

    <!-- رسالة النجاح -->
    <div class="success" id="successBox">

        <h2>🎉 تم تجهيز طلبك!</h2>

        <p>
            شكرًا لطلبك من Léa Délice ❤️
        </p>

        <p>
            سنتواصل معك لتأكيد الطلب والتوصيل.
        </p>

        <a class="back" href="products.html">
            🍰 العودة إلى الحلويات
        </a>

    </div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("leaCart")) || [];

const orderItems = document.getElementById("orderItems");
const orderTotal = document.getElementById("orderTotal");

/* عرض المنتجات */

if (cart.length === 0) {

    orderItems.innerHTML =
        "<p style='text-align:center;'>السلة فارغة حاليًا.</p>";

} else {

    let total = 0;
    let html = "";

    cart.forEach(function(item) {

        total += Number(item.price);

        html += `
            <div class="product">
                <span>${item.name}</span>
                <span>${item.price} دج</span>
            </div>
        `;

    });

    orderItems.innerHTML = html;
    orderTotal.textContent = total;
}


/* إرسال الطلب */

document.getElementById("orderForm").addEventListener("submit", function(event) {

    event.preventDefault();

    if (cart.length === 0) {

        alert("السلة فارغة! أضيفي منتجًا أولًا.");
        return;

    }

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const wilaya = document.getElementById("wilaya").value;
    const commune = document.getElementById("commune").value;
    const address = document.getElementById("address").value;
    const notes = document.getElementById("notes").value;

    const delivery =
        document.querySelector(
            'input[name="delivery"]:checked'
        ).value;

    const order = {

        name: name,
        phone: phone,
        wilaya: wilaya,
        commune: commune,
        address: address,
        delivery: delivery,
        notes: notes,
        products: cart,
        total: cart.reduce(
            (sum, item) => sum + Number(item.price),
            0
        ),
        date: new Date().toLocaleString("ar-DZ")

    };

    localStorage.setItem(
        "lastOrder",
        JSON.stringify(order)
    );

    /* إخفاء نموذج المعلومات */

    document.getElementById("customerFormBox").style.display = "none";

    /* إظهار رسالة النجاح */

    document.getElementById("successBox").style.display = "block";

    /* حذف السلة */

    localStorage.removeItem("leaCart");

});

</script>

</body>
</html>
